<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech — Funcionários</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Gerenciamento de funcionários</h1>

    <form id="formulario-funcionario">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>
        </div>

        <div>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1" step="1" required>
        </div>

        <div>
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" required>
        </div>

        <div>
            <label for="salario">Salário (R$):</label>
            <input type="number" id="salario"
                   min="0" step="0.01" required>
        </div>

        <button type="submit" id="botao-salvar">Cadastrar</button>
    </form>

    <h2>Funcionários cadastrados</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-funcionarios"></tbody>
    </table>

    <h2>Relatórios</h2>

    <button type="button" id="btn-salarios-altos">
        Salários acima de R$ 5.000
    </button>

    <button type="button" id="btn-media-salarial">
        Média salarial
    </button>

    <button type="button" id="btn-cargos">
        Cargos sem repetição
    </button>

    <button type="button" id="btn-nomes">
        Nomes em maiúsculas
    </button>

    <pre id="resultado-relatorio" aria-live="polite"></pre>
</body>
</html>
